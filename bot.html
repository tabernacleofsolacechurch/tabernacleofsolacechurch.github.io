<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14303b">
<title>TSC Assistant | Tabernacle of Solace Church</title>
<style>
:root{
  --bg:#e9eff1; --panel:#ffffff; --ink:#14262e; --muted:#5d727b;
  --brand:#14303b; --brand-ink:#f4f1e8; --gold:#b8862f; --gold-soft:#f3e7cc;
  --user:#14303b; --user-ink:#f4f1e8; --line:#d3dde1;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#0c1a20; --panel:#15262e; --ink:#e8eef0; --muted:#97aab2;
    --brand:#0f232b; --brand-ink:#f4f1e8; --gold:#d6a850; --gold-soft:#2c2a1f;
    --user:#d6a850; --user-ink:#1a1608; --line:#27404a;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.5;display:flex;justify-content:center;
}
.app{width:100%;max-width:640px;height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
header{
  background:var(--brand);color:var(--brand-ink);
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--gold);
}
.crest{
  width:42px;height:42px;border-radius:50%;flex:none;
  background:var(--gold);color:#14262e;display:grid;place-items:center;
  font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:15px;letter-spacing:.5px;
}
.title{font-family:Georgia,"Times New Roman",serif;font-size:18px;line-height:1.2}
.sub{font-size:12.5px;opacity:.8}
.head-wa{
  margin-left:auto;color:var(--brand-ink);text-decoration:none;font-size:13px;
  border:1px solid rgba(244,241,232,.45);padding:7px 12px;border-radius:999px;white-space:nowrap;
}
.head-wa:focus-visible,.chip:focus-visible,.btn:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#log{flex:1;overflow-y:auto;padding:16px 14px 8px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.msg{max-width:88%;padding:11px 14px;border-radius:18px;word-wrap:break-word;font-size:15.5px}
.msg.bot{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:5px;align-self:flex-start}
.msg.me{background:var(--user);color:var(--user-ink);border-bottom-right-radius:5px;align-self:flex-end}
.msg p+p{margin-top:8px}
.msg strong{font-family:Georgia,"Times New Roman",serif;font-weight:700}
.msg ul{margin:6px 0 2px 18px}
.msg li{margin:2px 0}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{
  display:inline-block;text-decoration:none;font-size:14px;font-weight:600;font-family:inherit;
  background:var(--gold);color:#1a1608;padding:9px 14px;border-radius:10px;border:0;cursor:pointer;
}
.btn.alt{background:var(--gold-soft);color:var(--ink);border:1px solid var(--gold)}
.typing{display:flex;gap:5px;padding:14px 16px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.typing i{animation:none;opacity:.7}#log{scroll-behavior:auto}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 14px;scrollbar-width:none;border-top:1px solid var(--line);background:var(--bg)}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;border:1px solid var(--gold);background:var(--panel);color:var(--ink);
  padding:8px 14px;border-radius:999px;font-size:14px;cursor:pointer;font-family:inherit;
}
.chip:active{background:var(--gold-soft)}
form{display:flex;gap:8px;padding:8px 14px calc(12px + env(safe-area-inset-bottom));background:var(--bg)}
input{
  flex:1;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  border-radius:999px;padding:12px 16px;font-size:16px;font-family:inherit;min-width:0;
}
form button{
  border:0;background:var(--brand);color:var(--brand-ink);border-radius:999px;
  padding:0 20px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;
}
@media (prefers-color-scheme: dark){form button{background:var(--gold);color:#1a1608}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="crest" aria-hidden="true">TSC</div>
    <div>
      <div class="title">Tabernacle of Solace</div>
      <div class="sub">Church assistant</div>
    </div>
    <a class="head-wa" id="headWa" href="#" target="_blank" rel="noopener">WhatsApp us</a>
  </header>
  <main id="log" aria-live="polite" aria-label="Conversation"></main>
  <div class="chips" id="chips" aria-label="Suggested questions"></div>
  <form id="form" autocomplete="off">
    <input id="box" type="text" placeholder="Type your question" aria-label="Type your question" enterkeyhint="send">
    <button type="submit">Send</button>
  </form>
</div>

<script>

const log = $("#log"), chipsEl = $("#chips"), box = $("#box");
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const wa = t => `https://wa.me/${C.whatsapp}${t ? "?text=" + encodeURIComponent(t) : ""}`;
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };

function norm(s){ return s.toLowerCase().replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim(); }
function lev(a,b){
  if (Math.abs(a.length-b.length) > 1) return 2;
  const m = Array.from({length:a.length+1},(_,i)=>[i]);
  for (let j=1;j<=b.length;j++) m[0][j]=j;
  for (let i=1;i<=a.length;i++) for (let j=1;j<=b.length;j++)
    m[i][j] = Math.min(m[i-1][j]+1, m[i][j-1]+1, m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return m[a.length][b.length];
}
function scoreIntent(text, words, kws){
  let s = 0;
  for (const k of kws){
    if (k.includes(" ")) { if (text.includes(k)) s += 3; continue; }
    for (const w of words){
      if (w === k) s += 2;
      else if (k.length >= 5 && w.length >= 5 && lev(w,k) <= 1) s += 1.5;
    }
  }
  return s;
}

function render(o){
  const d = document.createElement("div");
  d.className = "msg bot";
  let h = "";
  (o.text || "").split("\n\n").forEach(p => {
    const lines = p.split("\n");
    if (lines.every(l => l.startsWith("- "))) h += "<ul>" + lines.map(l => `<li>${esc(l.slice(2))}</li>`).join("") + "</ul>";
    else h += "<p>" + esc(p).replace(/\n/g,"<br>").replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>") + "</p>";
  });
  if (o.links && o.links.length){
    h += '<div class="actions">' + o.links.map(l => l.copy
      ? `<button type="button" class="btn alt" data-copy="${esc(l.copy)}">${esc(l.label)}</button>`
      : `<a class="btn${l.alt?" alt":""}" href="${l.url}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("") + "</div>";
  }
  d.innerHTML = h;
  return d;
}
function setChips(list){
  chipsEl.innerHTML = "";
  (list || MAIN_CHIPS).forEach(t => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = t;
    b.onclick = () => handle(t);
    chipsEl.appendChild(b);
  });
  chipsEl.scrollLeft = 0;
}
function scrollDown(){ log.scrollTop = log.scrollHeight; }
function user(t){
  const d = document.createElement("div"); d.className = "msg me"; d.textContent = t;
  log.appendChild(d); scrollDown();
}
function say(o, delay = 450){
  return new Promise(res => {
    const t = document.createElement("div");
    t.className = "msg bot typing"; t.innerHTML = "<i></i><i></i><i></i>";
    log.appendChild(t); scrollDown();
    setTimeout(() => {
      t.remove();
      log.appendChild(render(o));
      setChips(o.chips);
      scrollDown(); res();
    }, delay);
  });
}
log.addEventListener("click", e => {
  const b = e.target.closest("[data-copy]"); if (!b) return;
  const v = b.getAttribute("data-copy"), old = b.textContent;
  const done = () => { b.textContent = "Copied"; setTimeout(() => b.textContent = old, 1800); };
  if (navigator.clipboard) navigator.clipboard.writeText(v).then(done, done); else done();
});

const toWA = (label, msg) => ({ label, url: wa(msg) });

/* ---------- answers ---------- */
const A = {

    links: [{label:"His personal website", url:C.apostleSite}],
    chips: ["His teachings","Books","Invite the Apostle","Morning Altar"]

  teachings: () => ({

  thanks: () => ({ text: "You are welcome. God bless you. Is there anything else I can help with?" }),

  fallback: () => ({
    text: "I am not sure I have that information. Please pick a topic below, or send your question to the church team on WhatsApp.",
    links: [toWA("Ask on WhatsApp","Hello, I have a question: "), {label:"Church website", url:C.website, alt:true}]

const INTENTS = [
  ["greet",     ["hi","hello","hey","good morning","good afternoon","good evening","shalom","greetings","welcome"], 0.5],

  ["teachings", ["teaching","teachings","teach","doctrine","preach","topics","prophetic","deliverance","discipleship"]],
  ["giving",    ["give","giving","offering","offerings","tithe","tithes","seed","donate","donation","account","gtb","bank","transfer","pay","support"]],
  ["buy",       ["buy","purchase","order","selar","price","cost","how to buy","get book","get the book"]],
  ["books",     ["book","books","author","titles","publication","publications","read"]],
  ["devotional",["devotional","devotion","bible reading","daily devotional","word for today","quiet time"]],
  ["radio",     ["radio","tsc radio","listen","station","stream","live","online radio"]],
  ["audio",     ["audio","audio library","mp3","sermon","sermons","recorded messages","recordings"]],
  ["contact",   ["contact","whatsapp","phone","call","number","reach","email","chat","speak","website","site","link"]],
  ["thanks",    ["thanks","thank","thank you","bless","amen","god bless"], 0.5]
];

/* ---------- prayer request flow ---------- */
let flow = null;
function startPrayer(){
  flow = { step: "name", data: {} };
  return say({ text: "I am sorry for what you may be facing, and I am glad you reached out. Prayer at TSC is absolutely free.\n\nI can prepare your request for the church. It only reaches the church when you press send in WhatsApp.\n\nWhat is your name? You may write \"anonymous\" if you prefer.", chips: ["Anonymous","Cancel"] });
}
async function prayerStep(t){
  if (/^cancel$/i.test(t)){ flow = null; return say({ text: "No problem. You can ask for prayer any time." }); }
  if (flow.step === "name"){
    flow.data.name = /anonym/i.test(t) ? "Anonymous" : t;
    flow.step = "need";
    return say({ text: `Thank you${flow.data.name === "Anonymous" ? "" : ", " + flow.data.name}. What would you like prayer for?`, chips: ["Healing","Family","Finances","Direction","Cancel"] });
  }
  if (flow.step === "need"){
    flow.data.need = t;
    const d = flow.data; flow = null;
    const msg = `PRAYER REQUEST\nName: ${d.name}\nRequest: ${d.need}`;
    return say({
      text: "Your request is ready. Tap the button to open WhatsApp with it already written, then press send to reach the church.\n\nMay the Lord meet you at the point of your need.",
      links: [toWA("Open WhatsApp to send", msg)],
      chips: ["Morning Altar","Daily devotional","Mercy Encounter"]
    });
  }
}

/* ---------- router ---------- */
async function handle(raw){
  const t = raw.trim(); if (!t) return;
  user(t); box.value = "";
  if (flow) return prayerStep(t);
  const text = norm(t), words = text.split(" ");

  if (/(charge|free|cost|pay|price|fee).*(prayer|pray)|(prayer|pray).*(free|charge|cost|pay|fee)/.test(text)) return say(A.freeprayer());
  if (/\b(pray|prayer|prayers|intercession)\b/.test(text) && !/devotional|morning/.test(text)) return startPrayer();
  if (/how to buy|buy book|order book|buy the book/.test(text)) return say(A.buy());
  if (/his teachings|teachings of/.test(text)) return say(A.teachings());
  if (/first time|first timer|new here/.test(text)) return say(A.visitor());
  if (/about tsc|about the church/.test(text)) return say(A.about());

  for (const b of BOOKS){
    if (b.m.some(p => text.includes(p)) && (!b.needBook || /book|selar|read|buy/.test(text))) return say(A.book(b));
  }

  let best = null, top = 0;
  for (const [name, kws, w = 1] of INTENTS){
    const s = scoreIntent(text, words, kws) * w;
    if (s > top){ top = s; best = name; }
  }
  if (best && (top >= 1.5 || (best === "greet" && top >= 1))) return say(A[best]());

  if (C.aiEndpoint){
    try{
      const r = await fetch(C.aiEndpoint, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ message: t }) });
      const j = await r.json();
      if (j.reply) return say({ text: j.reply, chips: MAIN_CHIPS });
    }catch(e){ /* fall through */ }
  }
  return say(A.fallback());
}

$("#form").addEventListener("submit", e => { e.preventDefault(); handle(box.value); });
say(A.greet(), 300);
</script>
