<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>TSC site check</title>
<style>body{font:16px/1.5 system-ui,sans-serif;margin:0;padding:1.2rem;background:#f7f9fa;color:#222}h1{font-size:1.4rem;color:#1B2A4A}.r{background:#fff;border:1px solid #dce2ec;border-radius:10px;padding:.8rem 1rem;margin:.6rem 0;overflow-wrap:anywhere}.ok{border-left:6px solid #1F7A4A}.bad{border-left:6px solid #A32020}.w{border-left:6px solid #D4AF37}b{display:block}small{color:#555}</style></head>
<body><h1>TSC website check</h1><p>Please send a screenshot of this whole page.</p><div id="out"><p>Running checks\u2026</p></div>
<script src="config.js"></script>
<script>
(function(){
var out=document.getElementById("out"), C=window.TSC_CONFIG||{}, S=C.supabase||{}, rows=[];
function add(cls,title,detail){ rows.push([cls,title,detail||""]); draw(); }
function draw(){ out.textContent=""; rows.forEach(function(r){ var d=document.createElement("div"); d.className="r "+r[0]; var b=document.createElement("b"); b.textContent=r[1]; d.appendChild(b); var s=document.createElement("small"); s.textContent=r[2]; d.appendChild(s); out.appendChild(d); }); }
add("w","Page opened at",new Date().toString());
add(S.url?"ok":"bad","1. config.js loaded in this browser",S.url?("Backend address: "+S.url+"\nKey starts with: "+String(S.anonKey||"").slice(0,18)+"\u2026"):"The loaded config.js has NO backend address. This browser is using an old or missing config.js.");
var t=Date.now();
fetch("config.js?nocache="+t,{cache:"no-store"}).then(function(r){return r.text()}).then(function(x){ var has=x.indexOf("kniksxocjsuqghydipmg")>-1; add(has?"ok":"bad","2. config.js on the server (newest copy)",has?"Contains your Supabase address. Good.":"The file on GitHub does NOT contain your Supabase address. Upload the new config.js again."); }).catch(function(e){ add("bad","2. config.js on the server","Could not read it: "+e.message); });
fetch("site.js?nocache="+t,{cache:"no-store"}).then(function(r){return r.text()}).then(function(x){ var neu=x.indexOf('indexOf("eyJ")')>-1; add(neu?"ok":"bad","3. site.js on the server (newest copy)",neu?"This is the NEW site.js. Good.":"This is the OLD site.js. Upload the new site.js again."); }).catch(function(e){ add("bad","3. site.js on the server","Could not read it: "+e.message); });
if(S.url&&S.anonKey){
  var h={apikey:S.anonKey}; if(String(S.anonKey).indexOf("eyJ")===0)h.Authorization="Bearer "+S.anonKey;
  fetch(S.url.replace(/\/$/,"")+"/rest/v1/programmes?status=eq.published&select=id,title,start_at,end_at,status&order=start_at.asc",{headers:h}).then(function(r){ return r.text().then(function(tx){ if(!r.ok){ add("bad","4. Reading programmes from the database","HTTP "+r.status+"\n"+tx.slice(0,300)); return; } var j; try{j=JSON.parse(tx)}catch(e){ add("bad","4. Reading programmes","Unreadable answer: "+tx.slice(0,200)); return; } add(j.length?"ok":"w","4. Programmes the public can read","Found "+j.length+(j.length?(": "+j.map(function(p){return p.title+" ("+p.start_at+")"}).join("; ")):". The public sees none. Check the programme status is Published.")); var now=new Date(); var up=j.filter(function(p){return new Date(p.end_at||p.start_at)>=now}); add(up.length?"ok":"w","5. Of those, upcoming (not yet ended)",up.length+" upcoming. Current time: "+now.toISOString()); }); }).catch(function(e){ add("bad","4. Reading programmes from the database","Could not connect: "+e.message+" (a browser extension, data saver or network block can cause this)"); });
}else add("bad","4. Database test skipped","No backend keys were loaded.");
})();
</script></body></html>
